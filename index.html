<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration</title>
<style>
body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
form { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); width: 300px; }
h2 { text-align: center; margin-top: 0; }
label { display: block; margin-top: 12px; font-size: 14px; }
input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
button { width: 100%; margin-top: 18px; padding: 10px; background: #2da44e; color: #fff; border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
button:hover { background: #2c974b; }
</style>
</head>
<body>
<form action="#" method="post">
<h2>Register</h2>
<label for="name">Full Name</label>
<input type="text" id="name" name="name" required>
<label for="email">Email</label>
<input type="email" id="email" name="email" required>
<label for="password">Password</label>
<input type="password" id="password" name="password" minlength="6" required>
<button type="submit">Sign Up</button>
</form>
</body>
</html>
